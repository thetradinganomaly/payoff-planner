<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Payoff Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1312" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} img{max-width:100%} [hidden]{display:none!important}</style>
<script>window.STANDALONE=true;</script>
<title>Payoff Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: fixed bottom tab bar, one scrolling view at a time, cards on a soft paper ground; figures set in mono like a passbook. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#e9ece8; --ink:#161b19; --ink-2:#59625d; --ink-3:#8b948f;
  --line:#d8ddd9; --accent:#1c5a4d; --accent-soft:#dcebe5; --accent-ink:#ffffff;
  --nondebt:#2a78d6; --debt:#eb6834; --good:#008300; --good-soft:#dff2df; --warn:#c98500; --warn-soft:#fff1d6; --bad:#e34948; --bad-soft:#fde3e2;
  --font-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:14px; --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 20px rgba(20,30,25,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1312; --surface:#1a1f1d; --surface-2:#242a27; --ink:#eef1ee; --ink-2:#a9b2ad; --ink-3:#7c8580;
  --line:#2f3733; --accent:#5fc7a8; --accent-soft:#1d3a32; --accent-ink:#0b1511;
  --nondebt:#3987e5; --debt:#d95926; --good:#4ec15a; --good-soft:#163a1c; --warn:#e0a53a; --warn-soft:#3b2d10; --bad:#e66767; --bad-soft:#44201f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1312; --surface:#1a1f1d; --surface-2:#242a27; --ink:#eef1ee; --ink-2:#a9b2ad; --ink-3:#7c8580;
  --line:#2f3733; --accent:#5fc7a8; --accent-soft:#1d3a32; --accent-ink:#0b1511;
  --nondebt:#3987e5; --debt:#d95926; --good:#4ec15a; --good-soft:#163a1c; --warn:#e0a53a; --warn-soft:#3b2d10; --bad:#e66767; --bad-soft:#44201f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header + tab bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 8px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar h1{font-size:22px;font-weight:700}
.topbar .year{font-family:var(--font-num);font-size:13px;color:var(--ink-2);background:var(--surface-2);padding:4px 10px;border-radius:999px}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:4px calc(84px + env(safe-area-inset-bottom,0px));max-width:1180px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);font-size:11px;font-weight:600}
.tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent)}

/* generic blocks */
.view{display:grid;gap:16px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.card h2{font-size:15px;font-weight:600;margin-bottom:10px}
.grid{display:grid;gap:14px}
.grid.kpis{grid-template-columns:repeat(4,1fr)}
.grid.two{grid-template-columns:1fr 1fr}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
@media (max-width:760px){.grid.kpis{grid-template-columns:1fr 1fr}.grid.two{grid-template-columns:1fr}}
.kpi{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:4px;min-width:0}
.kpi .v{font-family:var(--font-num);font-size:clamp(18px,2.4vw,26px);font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--ink-2)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:6px 10px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.debt{background:color-mix(in srgb,var(--debt) 16%,transparent);color:var(--debt)}
.pill.nondebt{background:color-mix(in srgb,var(--nondebt) 16%,transparent);color:var(--nondebt)}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.empty{padding:32px 16px;text-align:center;color:var(--ink-2)}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}

/* item cards */
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start;text-align:left;width:100%;border:0;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;color:inherit;min-width:0}
.item .name{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .amt{font-family:var(--font-num);font-weight:600;font-size:17px;text-align:right;white-space:nowrap}
.item .meta{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-2)}
.item .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.item .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.item.paused{opacity:.6}
.item[role=button]{cursor:pointer}
.paylines{grid-column:1/-1;display:grid;gap:6px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.payline{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap}
.stat3{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:13px;margin-top:4px}
.stat3 b{font-family:var(--font-num)}
.stat3 .in{color:var(--good)}.stat3 .out{color:var(--debt)}.stat3 .neg{color:var(--bad)}
.cal-day .in{font-family:var(--font-num);font-size:11px;font-weight:600;color:var(--good);text-align:right;white-space:nowrap}
.cal-week .in{font-family:var(--font-num);font-size:11px;font-weight:600;color:var(--good);text-align:right;white-space:nowrap}
.dayrow i.inc{background:var(--good)}
.dayrow .amt.inc{color:var(--good)}
@media (max-width:600px){.cal-day .in,.cal-week .in{display:none}}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head h2{font-size:18px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr) 1.2fr;gap:4px}
.cal-grid.nototal{grid-template-columns:repeat(7,1fr)}
.cal-dow{text-align:center;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);padding:6px 0}
.cal-day{aspect-ratio:1/1;min-height:54px;border:0;background:var(--surface);border-radius:10px;padding:6px;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;color:inherit;box-shadow:var(--shadow);min-width:0}
.cal-day.blank{background:transparent;box-shadow:none}
.cal-day.other{opacity:.45}
.cal-week{aspect-ratio:auto;min-height:54px;background:var(--surface-2);box-shadow:none;border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.cal-week .l{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-week .t{font-family:var(--font-num);font-size:clamp(12px,1.6vw,15px);font-weight:700;text-align:right;white-space:nowrap}
.cal-week .s{font-size:10px;color:var(--ink-3);text-align:right;white-space:nowrap}
.cal-day .d{font-size:12px;color:var(--ink-3);font-weight:600;text-align:left}
.cal-day .t{font-family:var(--font-num);font-size:clamp(11px,1.5vw,14px);font-weight:600;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-day .dots{display:flex;gap:3px;flex-wrap:wrap}
.cal-day .dots i{width:5px;height:5px;border-radius:50%;background:var(--nondebt);display:block}
.cal-day .dots i.debt{background:var(--debt)}
.cal-day.has{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.cal-day.sel{outline:2px solid var(--accent)}
.cal-day.today .d{color:var(--accent)}
@media (max-width:600px){.cal-day{min-height:46px;padding:4px}.cal-day .dots{display:none}.cal-week{min-height:46px;padding:4px}.cal-week .s{display:none}}
.cal-head select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;min-height:36px;font-size:13px}
/* simulator */
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 10px;align-items:baseline}
.cmp .b{font-family:var(--font-num);color:var(--ink-3);text-decoration:line-through;font-size:14px}
.cmp .arrow{color:var(--ink-3)}
.cmp .n{font-family:var(--font-num);font-weight:600;font-size:clamp(17px,2.2vw,22px)}
.delta{font-family:var(--font-num);font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;display:inline-block}
.delta.good{background:var(--good-soft);color:var(--good)}.delta.bad{background:var(--bad-soft);color:var(--bad)}.delta.zero{background:var(--surface-2);color:var(--ink-3)}
.changes{display:grid;gap:8px}
.change{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.change .k{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:999px;white-space:nowrap}
.change button{border:0;background:var(--surface);border-radius:50%;width:26px;height:26px;color:var(--ink-2)}
.whatif{display:flex;flex-wrap:wrap;gap:8px}
.daylist{display:grid;gap:8px}
.dayrow{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dayrow:last-child{border-bottom:0}
.dayrow i{width:10px;height:10px;border-radius:50%;background:var(--nondebt)}
.dayrow i.debt{background:var(--debt)}
.dayrow .amt{font-family:var(--font-num);font-weight:600}
.dayrow .sub{font-size:12px;color:var(--ink-2)}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font-ui);font-size:11px;fill:var(--ink-2)}
.chart .num{font-family:var(--font-num)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.spark{width:100%;height:36px;display:block}

/* sheet (modal) */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);overflow:auto;border-radius:18px 18px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:700px){.sheet{border-radius:18px;padding-bottom:18px}}
.sheet h2{font-size:18px;margin-bottom:14px}
.form{display:grid;gap:12px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.form .two{grid-template-columns:1fr}}
.field{display:grid;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:12px;color:var(--ink-3)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;background:var(--bg);cursor:pointer;color:var(--ink-2)}
.seg input{position:absolute;opacity:0;width:0;height:0}
.seg input:checked + span{color:var(--accent-ink)}
.seg label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.calc{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13px;display:grid;gap:4px}
.calc b{font-family:var(--font-num)}
.sheet-actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* settings */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:5px 6px 5px 12px;font-size:13px}
.chip button{border:0;background:var(--surface);border-radius:50%;width:22px;height:22px;line-height:1;color:var(--ink-2)}
.chip .dbt{font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:999px;background:color-mix(in srgb,var(--debt) 18%,transparent);color:var(--debt)}
.addline{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.addline input{flex:1;min-width:160px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;min-height:40px}
.table-wrap{overflow-x:auto}
table.sum{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
table.sum th,table.sum td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line)}
table.sum th:first-child,table.sum td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
table.sum th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
table.sum tr.tot td{font-weight:700;border-top:2px solid var(--line)}
</style>

</head>
<body>
<header class="topbar">
  <h1 id="viewTitle">Overview</h1>
  <span class="year num" id="yearBadge"></span>
</header>
<main id="main"></main>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== ENGINE (mirrors the workbook) ===================== */
const FREQS = {
  weekly:{label:'Weekly',months:0,days:7}, biweekly:{label:'Biweekly',months:0,days:14},
  monthly:{label:'Monthly',months:1,days:0}, bimonthly:{label:'Every 2 months',months:2,days:0},
  quarterly:{label:'Quarterly',months:3,days:0}, semiannual:{label:'Semi-annual',months:6,days:0},
  annual:{label:'Annual',months:12,days:0}, once:{label:'One-time',months:0,days:0},
};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY=86400000;
const dn=(y,m,d)=>Math.round(Date.UTC(y,m-1,d)/DAY);               // day number
const fromDn=n=>{const t=new Date(n*DAY);return {y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate(),dow:t.getUTCDay()}};
const dim=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
const parseISO=s=>{if(!s)return null;const [y,m,d]=s.split('-').map(Number);return (y&&m&&d)?{y,m,d}:null};
const isoOf=n=>{const t=fromDn(n);return `${t.y}-${String(t.m).padStart(2,'0')}-${String(t.d).padStart(2,'0')}`};
const fmtDate=n=>{const t=fromDn(n);return `${MON[t.m-1]} ${t.d}, ${t.y}`};
const money=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
const money0=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
const fm=v=>money.format(v||0), fm0=v=>money0.format(v||0);

function cadence(item){return FREQS[item.freq]||FREQS.monthly}
function firstOcc(item,year){
  const due=parseISO(item.dueDate); if(!due)return null;
  const c=cadence(item), g=dn(due.y,due.m,due.d);
  if(c.days>0){const jan1=dn(year,1,1);const n=Math.ceil((jan1-g)/c.days);return g+n*c.days}
  if(c.months===0)return g;
  const fmo=((due.m-1)%c.months)+1;
  return dn(year,fmo,Math.min(due.d,dim(year,fmo)));
}
function occCount(item,first,year,m){           // day-based cadences only
  const c=cadence(item), som=dn(year,m,1), eom=dn(year,m,dim(year,m));
  const cnt=x=>Math.max(0,Math.floor((x-first)/c.days)+1);
  return {occ:cnt(eom)-cnt(som-1), lo:cnt(som-1)};
}
function gross(item,year,m){
  if(!item.name||item.status==='paused')return 0;
  if(item.startMonth&&m<item.startMonth)return 0;
  if(item.endMonth&&m>item.endMonth)return 0;
  const due=parseISO(item.dueDate); if(!due)return 0;
  const c=cadence(item), F=+item.amount||0;
  if(c.days>0){const first=firstOcc(item,year);return F*Math.max(0,occCount(item,first,year,m).occ)}
  if(c.months===0)return (due.y===year&&due.m===m)?F:0;
  return ((((m-due.m)%c.months)+c.months)%c.months===0)?F:0;
}
/* Joint amortization: every payment linked to a debt draws down ONE running balance.
   Each month: interest accrues at APR/12, then that month's payments are applied in order, each capped at what is left. */
function runSchedule(items,debts,year){
  const rows=items.filter(i=>i.name).map(item=>({item,debt:item.debtId?(debts.find(d=>d.id===item.debtId)||null):null,
    gross:Array.from({length:12},(_,i)=>gross(item,year,i+1)),pay:Array(12).fill(0)}));
  const ds={};
  debts.forEach(d=>{const linked=rows.filter(r=>r.debt===d);const bal=[],interest=[];let prev=+d.balance||0;const apr=+d.apr||0;let cleared=null;const start=d.startMonth||1;
    for(let m=0;m<12;m++){
      if(m+1<start){bal.push(0);interest.push(0);continue}
      if(!linked.length||prev<=0){bal.push(prev);interest.push(0);linked.forEach(r=>r.pay[m]=0);continue}
      const acc=prev*(1+apr/12);interest.push(acc-prev);let rem=acc;
      linked.forEach(r=>{const p=Math.max(0,Math.min(r.gross[m],rem));r.pay[m]=p;rem-=p});
      rem=Math.max(0,rem);if(rem===0&&cleared==null)cleared=m+1;bal.push(rem);prev=rem}
    ds[d.id]={bal,interest,cleared,linked,yearEnd:bal[11],interestTotal:interest.reduce((a,b)=>a+b,0)}});
  rows.forEach(r=>{if(!r.debt)r.pay=r.gross.slice();r.yearTotal=r.pay.reduce((a,b)=>a+b,0)});
  return {rows,ds};
}
function occurrences(item,year,m,monthTotal){   // [{dn, amount}] for one month
  const due=parseISO(item.dueDate); if(!due||monthTotal<=0)return [];
  const c=cadence(item), F=+item.amount||0, out=[];
  if(c.days>0){const first=firstOcc(item,year);const {occ,lo}=occCount(item,first,year,m);
    for(let j=0;j<occ;j++){const a=Math.min(F,Math.max(0,monthTotal-j*F));if(a>0)out.push({dn:first+(lo+j)*c.days,amount:a})}
    return out}
  if(c.months===0)return [{dn:dn(due.y,due.m,due.d),amount:monthTotal}];
  return [{dn:dn(year,m,Math.min(due.d,dim(year,m))),amount:monthTotal}];
}
function paymentsLeft(item,debt){
  if(!(debt&&+debt.balance>0))return 'Ongoing';
  const c=cadence(item), F=+item.amount||0, B=+debt.balance, apr=+debt.apr||0;
  if(c.months===0&&c.days===0)return 1;
  if(F<=0)return 'Payment too low';
  const r=c.days>0?apr*c.days/365:apr/12*c.months;
  if(r===0)return Math.ceil(B/F);
  const x=1-B*r/F; if(x<=0)return 'Payment too low';
  return Math.ceil(-Math.log(x)/Math.log(1+r));
}
/* When does this debt clear? Exact if inside the year; otherwise projected from the year-end balance at the same annual pace. */
function payoffInfo(d,st,year){
  const bal=+d.balance||0; if(bal<=0)return {label:'Paid off',date:null,cleared:true};
  if(!st||!st.linked.length)return {label:'No payment scheduled',date:null};
  if(st.cleared){const m=st.cleared;let last=null;st.linked.forEach(r=>occurrences(r.item,year,m,r.pay[m-1]).forEach(o=>{if(last==null||o.dn>last)last=o.dn}));
    if(last==null)last=dn(year,m,dim(year,m));return {label:'Clears '+fmtDate(last),date:last,cleared:true}}
  const me=st.linked.reduce((a,r)=>a+r.yearTotal,0)/12; if(me<=0)return {label:'No payment scheduled',date:null};
  const r=(+d.apr||0)/12,B=st.yearEnd;let n;
  if(r===0)n=Math.ceil(B/me);else{const x=1-B*r/me;if(x<=0)return {label:'Payment too low',date:null};n=Math.ceil(-Math.log(x)/Math.log(1+r))}
  const tot=11+n,y=year+Math.floor(tot/12),mm=(tot%12)+1;const date=dn(y,mm,dim(y,mm));
  return {label:'Payoff '+fmtDate(date),date};
}

/* derived model, recomputed on each render */
function summarize(items,debts,Y){
  const typeIsDebt=Object.fromEntries(S.lists.types.map(t=>[t.name,t.debt]));
  const {rows,ds}=runSchedule(items,debts,Y);
  rows.forEach(r=>{r.isDebtType=!!typeIsDebt[r.item.type];r.isDebt=!!(r.debt&&+r.debt.balance>0);r.bal=r.debt?ds[r.debt.id].bal:Array(12).fill(null);
    r.left=paymentsLeft(r.item,r.debt);r.payoff=r.debt?payoffInfo(r.debt,ds[r.debt.id],Y):{label:'Ongoing',date:null}});
  const monthTotal=Array(12).fill(0),debtMonth=Array(12).fill(0),balMonth=Array(12).fill(0);const byCat={},byType={};
  rows.forEach(r=>{for(let m=0;m<12;m++){monthTotal[m]+=r.pay[m];if(r.isDebtType)debtMonth[m]+=r.pay[m]}
    byCat[r.item.category||'Uncategorized']=(byCat[r.item.category||'Uncategorized']||0)+r.yearTotal;byType[r.item.type]=(byType[r.item.type]||0)+r.yearTotal});
  const dl=debts.filter(d=>d.name).map(d=>{const st=ds[d.id];const row=st.linked[0]||null;const bal=+d.balance||0,apr=+d.apr||0,minp=+d.minPayment||0;
    for(let m=0;m<12;m++)balMonth[m]+=st.bal[m];
    let minMonths=null;if(bal>0&&minp>0){if(apr===0)minMonths=Math.ceil(bal/minp);else{const x=1-bal*apr/12/minp;minMonths=x<=0?'Payment too low':Math.ceil(-Math.log(x)/Math.log(1+apr/12))}}
    return {debt:d,row,linked:st.linked,yearEnd:st.yearEnd,interest:st.interestTotal,payoff:payoffInfo(d,st,Y),scheduled:st.linked.reduce((a,r)=>a+r.yearTotal,0),minMonths,util:(+d.limit>0)?bal/+d.limit:null}});
  const incomeMonth=Array(12).fill(0);(S.income||[]).forEach(inc=>{for(let m=1;m<=12;m++)incomeMonth[m-1]+=gross(inc,Y,m)});
  return {Y,rows,ds,monthTotal,debtMonth,balMonth,byCat,byType,debts:dl,incomeMonth,income:incomeMonth.reduce((a,b)=>a+b,0),
    total:monthTotal.reduce((a,b)=>a+b,0),debtTotal:debtMonth.reduce((a,b)=>a+b,0),
    balanceNow:dl.reduce((a,d)=>a+(+d.debt.balance||0),0),balanceEnd:dl.reduce((a,d)=>a+(d.yearEnd||0),0),
    interest:dl.reduce((a,d)=>a+d.interest,0),cleared:dl.filter(d=>+d.debt.balance>0&&d.yearEnd===0).length};
}
function model(){return summarize(S.items,S.debts,+S.year||new Date().getFullYear())}
function dayMap(M,year,month){   // { dn: [{row, amount}] }
  const map={};if(month<1||month>12)return map;M.rows.forEach(r=>{occurrences(r.item,year,month,r.pay[month-1]).forEach(o=>{(map[o.dn]=map[o.dn]||[]).push({row:r,amount:o.amount})})});return map;
}

/* ---- what-if scenarios: changes applied to a copy of the real data ---- */
function applyScenario(changes,Y){
  const items=S.items.map(i=>({...i})),debts=S.debts.map(d=>({...d}));
  const md=m=>String(Math.min(12,Math.max(1,+m||1))).padStart(2,'0');
  changes.forEach(c=>{const debt=debts.find(d=>d.id===c.debtId);
    if(c.kind==='extra'&&debt)items.push({id:'sim-'+c.id,name:`Extra ${fm0(c.amount)}/mo on ${debt.name}`,type:debt.type,category:'What-if',debtId:debt.id,amount:+c.amount,dueDate:`${Y}-${md(c.month)}-28`,freq:'monthly',startMonth:+c.month||1,status:'active',sim:true});
    if(c.kind==='lump'&&debt)items.push({id:'sim-'+c.id,name:`Lump sum on ${debt.name}`,type:debt.type,category:'What-if',debtId:debt.id,amount:+c.amount,dueDate:`${Y}-${md(c.month)}-28`,freq:'once',status:'active',sim:true});
    if(c.kind==='newDebt'){const id='simdebt-'+c.id;debts.push({id,name:c.name,type:c.type,lender:'',balance:+c.balance,apr:(+c.aprPct||0)/100,limit:0,minPayment:0,startMonth:+c.month||1,sim:true});
      if(+c.payment>0)items.push({id:'sim-'+c.id,name:c.name+' payment',type:c.type,category:'What-if',debtId:id,amount:+c.payment,dueDate:`${Y}-${md(c.month)}-15`,freq:c.freq||'monthly',startMonth:+c.month||1,status:'active',sim:true})}
    if(c.kind==='newBill')items.push({id:'sim-'+c.id,name:c.name,type:c.type||'Bill / Utility',category:'What-if',debtId:'',amount:+c.amount,dueDate:`${Y}-${md(c.month)}-15`,freq:c.freq||'monthly',startMonth:+c.month||1,status:'active',sim:true});
    if(c.kind==='remove'){const it=items.find(i=>i.id===c.itemId);if(it){if((+c.month||1)<=1)it.status='paused';else it.endMonth=(+c.month)-1}}
    if(c.kind==='setAmount'){const it=items.find(i=>i.id===c.itemId);if(it)it.amount=+c.amount}
    if(c.kind==='payoffDebt'&&debt){items.push({id:'sim-'+c.id,name:`Pay off ${debt.name}`,type:debt.type,category:'What-if',debtId:debt.id,amount:1e12,dueDate:`${Y}-${md(c.month)}-28`,freq:'once',status:'active',sim:true})}
  });
  return {items,debts};
}
function describeChange(c){const d=S.debts.find(x=>x.id===c.debtId),it=S.items.find(x=>x.id===c.itemId);const mo=m=>MON[(+m||1)-1];
  switch(c.kind){
    case 'extra':return [`Pay extra`,`${fm0(c.amount)} more every month on ${d?d.name:'?'}, from ${mo(c.month)}`];
    case 'lump':return [`Lump sum`,`${fm0(c.amount)} one-time on ${d?d.name:'?'} in ${mo(c.month)}`];
    case 'payoffDebt':return [`Pay off`,`${d?d.name:'?'} in full in ${mo(c.month)}`];
    case 'newDebt':return [`New debt`,`${c.name}: ${fm0(c.balance)} at ${(+c.aprPct||0).toFixed(2)}% APR, paying ${fm0(c.payment)} ${(FREQS[c.freq]||FREQS.monthly).label.toLowerCase()} from ${mo(c.month)}`];
    case 'newBill':return [`New bill`,`${c.name}: ${fm0(c.amount)} ${(FREQS[c.freq]||FREQS.monthly).label.toLowerCase()} from ${mo(c.month)}`];
    case 'remove':return [`Cancel`,`${it?it.name:'?'} ${(+c.month||1)<=1?'for the whole year':'from '+mo(c.month)}`];
    case 'setAmount':return [`Change payment`,`${it?it.name:'?'} to ${fm0(c.amount)} per payment`];
  }return ['Change',''];
}

/* ---- charts (inline SVG, drawn to scale) ---- */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p}
function barChart(series,labels,opts={}){ // series: [{name,values,color}] stacked
  const W=600,H=220,pl=56,pr=10,pt=10,pb=28;const n=labels.length;
  const totals=labels.map((_,i)=>series.reduce((a,s)=>a+(s.values[i]||0),0));
  const max=niceMax(Math.max(...totals));const iw=(W-pl-pr)/n,bw=Math.min(28,iw*.6);
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  let g='<g class="grid">';for(let k=0;k<=4;k++){const v=max*k/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="num" x="${pl-6}" y="${y(v)+4}" text-anchor="end">${fm0(v)}</text>`}g+='</g>';
  let bars='';labels.forEach((lab,i)=>{let acc=0;const x=pl+iw*i+(iw-bw)/2;
    series.forEach((s,si)=>{const v=s.values[i]||0;if(v<=0)return;const y1=y(acc+v),y0=y(acc);const h=Math.max(0,y0-y1-(si>0?2:0));
      bars+=`<rect x="${x}" y="${y1}" width="${bw}" height="${h}" rx="${si===series.length-1?4:0}" fill="${s.color}"></rect>`;acc+=v});
    const tipTxt=series.length>1?series.map(s=>`${esc(s.name)}: ${fm(s.values[i]||0)}`).join('<br>'):fm(totals[i]);
    bars+=`<rect x="${pl+iw*i}" y="${pt}" width="${iw}" height="${H-pt-pb}" fill="transparent" data-tip="<b>${esc(lab)}</b><br>${tipTxt}"></rect>`;
    bars+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${esc(lab)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'Bar chart')}">${g}<line class="axis" x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}"/>${bars}</svg>`;
}
function lineChart(series,labels,opts={}){ // series: [{name,values,color,dash}]
  const W=600,H=200,pl=64,pr=12,pt=12,pb=26;const n=labels.length;
  const all=series.flatMap(s=>s.values);const vmax=Math.max(...all),vmin=Math.min(...all);
  const span=vmax-vmin;const lo=opts.zero?0:Math.max(0,vmin-span*.5);const hi=opts.zero?niceMax(vmax):(vmax+span*.25||vmax*1.1||1);
  const x=i=>pl+(W-pl-pr)*i/(n-1),y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo||1));
  let g='<g class="grid">';for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="num" x="${pl-6}" y="${y(v)+4}" text-anchor="end">${fm0(v)}</text>`}g+='</g>';
  let body='',lab='';labels.forEach((l,i)=>lab+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`);
  series.forEach((s,si)=>{const pts=s.values.map((v,i)=>`${x(i)},${y(v)}`).join(' ');const last=s.values.length-1;
    if(si===0&&!s.dash)body+=`<polygon points="${x(0)},${y(lo)} ${pts} ${x(last)},${y(lo)}" fill="${s.color}" opacity=".12"></polygon>`;
    body+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" ${s.dash?'stroke-dasharray="5 4"':''}></polyline><circle cx="${x(last)}" cy="${y(s.values[last])}" r="4" fill="${s.color}"></circle>`});
  labels.forEach((l,i)=>{const t=series.map(s=>`${esc(s.name)}: ${fm(s.values[i])}`).join('<br>');body+=`<rect x="${x(i)-(W-pl-pr)/(n-1)/2}" y="${pt}" width="${(W-pl-pr)/(n-1)}" height="${H-pt-pb}" fill="transparent" data-tip="<b>${esc(l)}</b><br>${t}"></rect>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'Line chart')}">${g}${body}${lab}</svg>`;
}
function donut(a,b,ca,cb,la,lb){
  const tot=a+b||1,R=46,C=2*Math.PI*R;const fa=a/tot,gap=tot>0&&a>0&&b>0?3:0;
  return `<svg class="chart" viewBox="0 0 120 120" style="max-width:150px;margin:0 auto" role="img" aria-label="${esc(la)} ${Math.round(fa*100)}%, ${esc(lb)} ${Math.round((1-fa)*100)}%">
    <circle cx="60" cy="60" r="${R}" fill="none" stroke="${cb}" stroke-width="14"></circle>
    <circle cx="60" cy="60" r="${R}" fill="none" stroke="${ca}" stroke-width="14" stroke-dasharray="${Math.max(0,C*fa-gap)} ${C}" transform="rotate(-90 60 60)" stroke-linecap="butt"></circle>
    <text class="num" x="60" y="56" text-anchor="middle" style="font-size:16px;font-weight:600;fill:var(--ink)">${Math.round(fa*100)}%</text>
    <text x="60" y="72" text-anchor="middle">${esc(la)}</text></svg>`;
}
function hbarChart(pairs,color){ // [[label,value]] sorted desc
  const rowH=24,W=600,pl=170,pr=70;const H=pairs.length*rowH+6;const max=niceMax(Math.max(...pairs.map(p=>p[1]),1));
  let s='';pairs.forEach(([lab,v],i)=>{const y=i*rowH+4,w=(W-pl-pr)*v/max;
    s+=`<text x="${pl-8}" y="${y+14}" text-anchor="end">${esc(lab.length>24?lab.slice(0,23)+'…':lab)}</text><rect x="${pl}" y="${y+3}" width="${Math.max(2,w)}" height="${rowH-9}" rx="4" fill="${color}" data-tip="<b>${esc(lab)}</b><br>${fm(v)}"></rect><text class="num" x="${pl+w+6}" y="${y+14}">${fm0(v)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart by category">${s}</svg>`;
}
function spark(values,color){const n=values.length;if(n<2)return '';const mx=Math.max(...values)||1;const mn=0;
  const pts=values.map((v,i)=>`${(i/(n-1))*100},${30-(v-mn)/(mx-mn||1)*26}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 32" preserveAspectRatio="none"><polygon points="0,32 ${pts} 100,32" fill="${color}" opacity=".12"></polygon><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"></polyline></svg>`}

let view='overview';
let cal={y:null,m:null,sel:null};
function nav(v){view=VIEWS[v]?v:'overview';try{if(location.hash!=='#'+view)history.replaceState(null,'',"#"+view)}catch(e){}render()}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==view)nav(h)});

function render(){
  const M=model();
  $('#viewTitle').textContent=VIEWS[view];$('#yearBadge').textContent=M.Y;
  $('#tabbar').innerHTML=Object.entries(VIEWS).map(([k,l])=>`<button type="button" data-nav="${k}" ${k===view?'aria-current="page"':''}>${ICONS[k]}<span>${l}</span></button>`).join('');
  const main=$('#main');main.scrollTop=0;
  main.innerHTML=({overview:vOverview,bills:vBills,calendar:vCalendar,simulator:vSimulator,settings:vSettings})[view](M);

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-nav]');if(b){nav(b.dataset.nav);window.scrollTo(0,0);return}
  const a=e.target.closest('[data-act]');if(a){actions[a.dataset.act]?.(a,e)}

function sampleBanner(){return S.sample?`<div class="banner"><span>These are <b>sample entries</b> so you can see how it works.</span><span class="spacer"></span><button class="btn small" type="button" data-act="clearSample">Clear samples and start fresh</button></div>`:''}

function vOverview(M){
  const monthsWith=M.monthTotal.filter(v=>v>0).length||1;
  const top=Object.entries(M.byCat).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const typePairs=Object.entries(M.byType).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const nonDebt=M.monthTotal.map((v,i)=>v-M.debtMonth[i]);
  const kpi=(l,v,s)=>`<div class="kpi"><span class="label">${l}</span><span class="v">${v}</span>${s?`<span class="s">${s}</span>`:''}</div>`;
  return `<div class="view">${sampleBanner()}
  <div class="grid kpis">
    ${kpi('Scheduled this year',fm0(M.total),M.income?`${fm0(M.total/monthsWith)} avg per month · income ${fm0(M.income/12)}/mo · <b class="num" style="color:${M.income-M.total>=0?'var(--good)':'var(--bad)'}">${fm0((M.income-M.total)/12)}</b> left`:`${fm0(M.total/monthsWith)} avg per month`)}
    ${kpi('Debt payments',fm0(M.debtTotal),`${M.total?Math.round(M.debtTotal/M.total*100):0}% of total`)}
    ${kpi('Debt balance now',fm0(M.balanceNow),`${M.debts.length} account${M.debts.length===1?'':'s'}`)}
    ${kpi('Projected year-end',fm0(M.balanceEnd),M.cleared?`<span class="pill good">${M.cleared} paid off this year</span>`:`${fm0(M.balanceNow-M.balanceEnd)} paid down`)}
  </div>
  <div class="grid two">
    <div class="card"><h2>Payments by month</h2>${barChart([{name:'Debt payments',values:M.debtMonth,color:'var(--debt)'},{name:'Bills & spending',values:nonDebt,color:'var(--nondebt)'}],MON,{aria:'Scheduled payments by month, debt and non-debt stacked'})}
      <div class="legend"><span><i style="background:var(--debt)"></i>Debt payments</span><span><i style="background:var(--nondebt)"></i>Bills &amp; spending</span></div></div>
    <div class="card"><h2>Projected debt balance</h2>${M.balanceNow>0?lineChart([{name:'Balance',values:M.balMonth,color:'var(--debt)'}],MON,{aria:'Projected total debt balance at the end of each month'}):'<div class="empty">Add a debt with a balance to see its payoff curve.</div>'}</div>
    <div class="card"><h2>Debt vs everything else</h2><div class="row" style="justify-content:center;gap:24px">${donut(M.debtTotal,M.total-M.debtTotal,'var(--debt)','var(--nondebt)','Debt','Other')}
      <div class="small"><div><i class="pill debt">Debt</i> <b class="num">${fm(M.debtTotal)}</b></div><div style="margin-top:8px"><i class="pill nondebt">Bills &amp; spending</i> <b class="num">${fm(M.total-M.debtTotal)}</b></div></div></div></div>
    <div class="card"><h2>By type</h2>${typePairs.length?hbarChart(typePairs,'var(--nondebt)'):'<div class="empty">Nothing scheduled yet.</div>'}</div>
  </div>
  <div class="card"><h2>Top categories this year</h2>${top.length?hbarChart(top,'var(--nondebt)'):'<div class="empty">Nothing scheduled yet.</div>'}</div>
  <div class="card"><h2>Month by month</h2><div class="table-wrap"><table class="sum"><thead><tr><th>Category</th>${MON.map(m=>`<th>${m}</th>`).join('')}<th>Year</th></tr></thead><tbody>
    ${Object.keys(M.byCat).filter(c=>M.byCat[c]>0).sort().map(c=>{const vals=Array(12).fill(0);M.rows.filter(r=>r.item.category===c).forEach(r=>r.pay.forEach((p,i)=>vals[i]+=p));
      return `<tr><td>${esc(c)}</td>${vals.map(v=>`<td class="num">${v?fm0(v):'–'}</td>`).join('')}<td class="num">${fm0(M.byCat[c])}</td></tr>`}).join('')}
    <tr class="tot"><td>Total</td>${M.monthTotal.map(v=>`<td class="num">${fm0(v)}</td>`).join('')}<td class="num">${fm0(M.total)}</td></tr></tbody></table></div></div>
  </div>`;
}

function itemCard(r){
  const {item,debt}=r;const c=cadence(item);const isDebt=r.isDebt;
  let prog='';if(isDebt){const b=+debt.balance,paid=Math.min(b,r.yearTotal);prog=`<div class="bar"><i style="width:${Math.round(paid/b*100)}%"></i></div>`}
  const status=item.status==='paused'?'<span class="pill">Paused</span>':isDebt?(r.payoff.cleared?'<span class="pill good">Paid off this year</span>':typeof r.left==='number'?`<span class="pill debt">${r.left} payments left</span>`:`<span class="pill bad">${r.left}</span>`):'<span class="pill nondebt">Ongoing</span>';
  const when=c.days>0?`every ${c.days} days from ${item.dueDate?fmtDate(dn(...Object.values(parseISO(item.dueDate)))):'?'}`:c.months===0?`once on ${item.dueDate?fmtDate(dn(...Object.values(parseISO(item.dueDate)))):'?'}`:`${c.label.toLowerCase()}, day ${parseISO(item.dueDate)?.d??'?'}`;
  return `<button class="item ${item.status==='paused'?'paused':''}" type="button" data-act="editItem" data-id="${item.id}">
    <span class="name">${esc(item.name)}</span><span class="amt">${fm(item.amount)}</span>
    <span class="meta">${status}<span>${esc(item.category)}</span><span>·</span><span>${esc(when)}</span>${isDebt?`<span>·</span><span>owes ${fm0(debt.balance)}</span>`:''}</span>
    ${prog}<span class="meta"><span>${fm0(r.yearTotal)} this year</span>${r.payoff.date?`<span>·</span><span>${esc(r.payoff.label.toLowerCase())}</span>`:''}</span></button>`;
}
function vBills(M){
  const linkedIds=new Set(M.debts.flatMap(d=>d.linked.map(r=>r.item.id)));
  const bills=M.rows.filter(r=>!linkedIds.has(r.item.id));
  const dbtTot=M.debts.reduce((a,d)=>a+d.scheduled,0);
  return `<div class="view">${sampleBanner()}
    <div class="row"><span class="muted small">Enter each bill or payment once. For a loan, card or payment plan, tick <b>This pays down a balance</b> and enter what you owe; the payoff date and interest appear on its card below.</span><span class="spacer"></span><label class="btn" for="xlsxFile">Import from Excel<input id="xlsxFile" type="file" accept=".xlsx,.xlsm" hidden></label><button class="btn primary" type="button" data-act="newItem">+ Add bill or payment</button></div>
    <div><div class="row" style="margin-bottom:8px"><span class="label">Debts</span><span class="spacer"></span><span class="small muted num">${M.debts.length?`owes ${fm0(M.balanceNow)} → ${fm0(M.balanceEnd)} by Dec · ${fm0(dbtTot)} / yr in payments`:''}</span></div>
      ${M.debts.length?`<div class="grid cards">${M.debts.map(debtCard).join('')}</div>`:'<div class="card empty">No debts yet. Tap <b>Add bill or payment</b>, pick a debt type such as Credit Card or Auto Loan, and enter the total owed.</div>'}</div>
    <div><div class="row" style="margin-bottom:8px"><span class="label">Bills &amp; spending</span><span class="spacer"></span><span class="small muted num">${bills.length?`${fm0(bills.reduce((a,r)=>a+r.yearTotal,0))} / yr`:''}</span></div>
      ${bills.length?`<div class="grid cards">${bills.map(itemCard).join('')}</div>`:'<div class="card empty">No bills yet. Tap <b>Add bill or payment</b>, or <b>Import from Excel</b> to load the whole workbook at once.</div>'}</div>
  </div>`;
}

const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function vCalendar(M){
  const today=new Date();const tdn=dn(today.getFullYear(),today.getMonth()+1,today.getDate());
  if(cal.y!==M.Y&&cal.m==null){cal.y=M.Y;cal.m=(today.getFullYear()===M.Y)?today.getMonth()+1:1}
  cal.y=M.Y;const ws=+S.weekStart||0;
  const map={...dayMap(M,cal.y,cal.m-1),...dayMap(M,cal.y,cal.m),...dayMap(M,cal.y,cal.m+1)};
  const inc={};[cal.m-1,cal.m,cal.m+1].forEach(mm=>{if(mm<1||mm>12)return;(S.income||[]).forEach(src=>occurrences(src,cal.y,mm,gross(src,cal.y,mm)).forEach(o=>{(inc[o.dn]=inc[o.dn]||[]).push({src,amount:o.amount})}))});
  const mIncome=M.incomeMonth[cal.m-1];
  const first=dn(cal.y,cal.m,1),n=dim(cal.y,cal.m);const offset=(fromDn(first).dow-ws+7)%7;const gridStart=first-offset;const weeks=Math.ceil((offset+n)/7);
  const mTotal=M.monthTotal[cal.m-1];
  if(cal.sel==null||fromDn(cal.sel).m!==cal.m||fromDn(cal.sel).y!==cal.y)cal.sel=(fromDn(tdn).m===cal.m&&fromDn(tdn).y===cal.y)?tdn:first;
  let cells='';
  for(let w=0;w<weeks;w++){let wk=0,wkIn=0;const wStart=gridStart+w*7;
    for(let i=0;i<7;i++){const k=wStart+i,t=fromDn(k),list=map[k]||[];const tot=list.reduce((a,x)=>a+x.amount,0);wk+=tot;const inList=inc[k]||[];const inTot=inList.reduce((a,x)=>a+x.amount,0);wkIn+=inTot;
      const other=t.m!==cal.m;const inYear=t.y===cal.y;
      if(other&&!inYear){cells+='<div class="cal-day blank"></div>';continue}
      cells+=`<button type="button" class="cal-day ${other?'other':''} ${tot>0&&!other?'has':''} ${k===cal.sel?'sel':''} ${k===tdn?'today':''}" data-act="selDay" data-dn="${k}" aria-label="${MON[t.m-1]} ${t.d}, ${tot>0?fm(tot):'nothing due'}${inTot?', income '+fm(inTot):''}">
        <span class="d">${other?MON[t.m-1]+' ':''}${t.d}</span><span class="dots">${list.slice(0,6).map(x=>`<i class="${x.row.isDebtType?'debt':''}"></i>`).join('')}</span><span class="t">${tot>0?fm0(tot):''}</span>${inTot?`<span class="in">+${fm0(inTot)}</span>`:''}</button>`}
    const a=fromDn(wStart),b=fromDn(wStart+6);
    cells+=`<div class="cal-week" data-tip="${esc(DOW[ws].slice(0,3))} ${MON[a.m-1]} ${a.d} – ${esc(DOW[(ws+6)%7].slice(0,3))} ${MON[b.m-1]} ${b.d}: ${fm(wk)}"><span class="l">Week ${w+1}</span><span class="t">${fm0(wk)}</span>${wkIn?`<span class="in">+${fm0(wkIn)} in</span>`:''}<span class="s">${MON[a.m-1]} ${a.d}–${a.m===b.m?'':MON[b.m-1]+' '}${b.d}</span></div>`}
  const sel=map[cal.sel]||[];const selTot=sel.reduce((a,x)=>a+x.amount,0);const selIn=inc[cal.sel]||[];
  const dows=Array.from({length:7},(_,i)=>DOW[(ws+i)%7].slice(0,3));
  return `<div class="view">
    <div class="card"><div class="cal-head"><button class="btn small" type="button" data-act="calPrev" aria-label="Previous month">‹</button>
      <div style="text-align:center"><h2>${MONTHS[cal.m-1]} ${cal.y}</h2><div class="stat3">${mIncome?`<span class="in">Income <b>+${fm0(mIncome)}</b></span>`:''}<span class="out">Expenses <b>−${fm0(mTotal)}</b></span>${mIncome?`<span class="${mIncome-mTotal>=0?'in':'neg'}">Left over <b>${mIncome-mTotal<0?'−':''}${fm0(Math.abs(mIncome-mTotal))}</b></span>`:''}</div>${mIncome?'':'<div class="small muted">Add your income under Settings to see what is left over each month.</div>'}</div>
      <button class="btn small" type="button" data-act="calNext" aria-label="Next month">›</button></div>
      <div class="row" style="margin-top:10px;justify-content:center"><label class="small muted" for="weekStart">Week runs</label><select id="weekStart">${DOW.map((d,i)=>`<option value="${i}" ${i===ws?'selected':''}>${d} to ${DOW[(i+6)%7]}</option>`).join('')}</select><span class="small muted">— set it to your payday so each week's total matches a paycheck</span></div>
      <div class="cal-grid" style="margin-top:10px">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}<div class="cal-dow">Week</div>${cells}</div>
      <div class="legend"><span><i style="background:var(--debt)"></i>Debt payment</span><span><i style="background:var(--nondebt)"></i>Bill or spending</span><span class="muted">Faded days belong to the neighbouring month but count toward that week's total.</span></div></div>
    <div class="card"><div class="row"><h2 style="margin:0">${fmtDate(cal.sel)}</h2><span class="spacer"></span><b class="num">${fm(selTot)}</b></div>
      <div class="daylist" style="margin-top:6px">${selIn.map(x=>`<div class="dayrow"><i class="inc"></i><div><div>${esc(x.src.name)}</div><div class="sub">Income · ${(FREQS[x.src.freq]||FREQS.monthly).label}</div></div><span class="amt inc">+${fm(x.amount)}</span></div>`).join('')}${sel.length?sel.map(x=>`<div class="dayrow"><i class="${x.row.isDebtType?'debt':''}"></i><div><div>${esc(x.row.item.name)}</div><div class="sub">${esc(x.row.item.category)} · ${esc(x.row.item.method||'')}${x.amount<+x.row.item.amount-0.005?' · final payment, trimmed to what is left':''}</div></div><span class="amt">${fm(x.amount)}</span></div>`).join(''):(selIn.length?'':'<div class="empty">Nothing due on this day.</div>')}</div></div>
  </div>`;
}

function debtCard(d){
  const {debt,linked}=d;const bal=+debt.balance||0;const row=d.row;
  const status=bal<=0?'<span class="pill good">Paid off</span>':d.yearEnd===0?'<span class="pill good">Clears this year</span>':!linked.length?'<span class="pill warn">No payment scheduled</span>':linked.every(r=>r.item.status==='paused')?'<span class="pill">Paused</span>':d.payoff.label==='Payment too low'?'<span class="pill bad">Payment too low</span>':linked.length>1?`<span class="pill debt">${linked.length} payments linked</span>`:typeof row.left==='number'?`<span class="pill debt">${row.left} payments left</span>`:`<span class="pill bad">${row.left}</span>`;
  const util=d.util!=null?`<span class="${d.util>0.3?'pill bad':'pill'}">${Math.round(d.util*100)}% of limit</span>`:'';
  const pays=linked.length?linked.map(r=>`<span class="payline"><span>${esc(r.item.name)} · <b class="num">${fm0(r.item.amount)}</b> ${cadence(r.item).label.toLowerCase()}${r.item.dueDate?` from ${fmtDate(dn(...Object.values(parseISO(r.item.dueDate))))}`:''}${r.item.status==='paused'?' · <b>paused</b>':''}</span><button class="btn small" type="button" data-act="editItem" data-id="${r.item.id}">Edit payment</button></span>`).join('')
    :`<span class="payline"><span class="muted">No payment scheduled for this debt yet</span><button class="btn small primary" type="button" data-act="newItemFor" data-id="${debt.id}">+ Add payment</button></span>`;
  return `<div class="item" role="button" tabindex="0" data-act="editDebt" data-id="${debt.id}" aria-label="Edit ${esc(debt.name)}">
    <span class="name">${esc(debt.name)}</span><span class="amt">${fm(bal)}</span>
    <span class="meta">${status}${util}<span>${esc(debt.type)}</span>${debt.lender?`<span>·</span><span>${esc(debt.lender)}</span>`:''}<span>·</span><span>${((+debt.apr||0)*100).toFixed(2)}% APR</span></span>
    ${linked.length&&bal>0?`<span style="grid-column:1/-1">${spark([bal,...linked[0].bal],'var(--debt)')}</span>`:''}
    <span class="meta"><span>min ${fm0(debt.minPayment)}/mo</span><span>·</span><span>year-end ${fm0(d.yearEnd)}</span>${d.payoff.date?`<span>·</span><span>${esc(d.payoff.label.toLowerCase())}</span>`:''}<span>·</span><span>${fm0(d.interest)} interest this year</span></span>
    <span class="paylines">${pays}</span></div>`;
}

function vSettings(M){
  const chips=(key,arr,isType)=>`<div class="chips">${arr.map((v,i)=>{const name=isType?v.name:v;return `<span class="chip">${esc(name)}${isType&&v.debt?'<span class="dbt">DEBT</span>':''}${isType?`<button type="button" data-act="toggleDebt" data-i="${i}" title="Toggle counts-as-debt" aria-label="Toggle debt for ${esc(name)}">$</button>`:''}<button type="button" data-act="rmList" data-key="${key}" data-i="${i}" aria-label="Remove ${esc(name)}">×</button></span>`}).join('')}</div>

      <div class="row" style="margin-top:10px"><button class="btn primary" type="button" data-act="newIncome">+ Add income</button><span class="small muted num">${M.income?`${fm0(M.income)} this year · ${fm0(M.income/12)} per month on average`:''}</span></div></div>
    <div class="card"><h2>Import from the Excel template</h2><p class="small muted" style="margin:0 0 10px">Fill in <b>Payoff_Planner_Import.xlsx</b> - its Bills &amp; Debts and Income tabs have exactly the app's fields - then load it here. Every row is listed in a preview before anything is saved. The older Expense &amp; Debt Tracker workbook still imports too.</p>
      <div class="row"><label class="btn primary" for="xlsxFile2">Choose the .xlsx file<input id="xlsxFile2" type="file" accept=".xlsx,.xlsm" hidden></label><span class="small muted">The spreadsheet reader downloads the first time you use this (about 1 MB), then stays cached.</span></div></div>
    <div class="card"><h2>Backup</h2><p class="small muted" style="margin:0 0 10px">Your data lives only on this device. Keep a backup: copy it somewhere safe (Notes, iCloud Drive, email to yourself) and paste it back here to restore.</p>
      <div class="row"><button class="btn primary" type="button" data-act="copyBackup">Copy backup</button>${window.STANDALONE?'<button class="btn" type="button" data-act="downloadBackup">Download file</button>':''}<label class="btn" for="importFile">Restore from file<input id="importFile" type="file" accept=".json,application/json" hidden></label><button class="btn" type="button" data-act="showPaste">Paste a backup</button></div>

function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=()=>res(window.XLSX);sc.onerror=()=>rej(new Error('xlsx load failed'));document.head.appendChild(sc)})}

  let nInc=0;(P.income||[]).forEach(x=>{S.income=S.income||[];const ex=S.income.find(y=>key(y.name)===key(x.name));if(ex)Object.assign(ex,x);else S.income.push({id:uid(),...x});nInc++});
  debts.forEach(d=>{const {sample,fromRow,hasBalFlag,...rec}=d;const ex=S.debts.find(x=>key(x.name)===key(d.name));if(ex)Object.assign(ex,rec);else S.debts.push({id:uid(),...rec});nd++});

  const addTo=(arr,v)=>{if(v&&!arr.some(x=>key(x)===key(v)))arr.push(v)};
  if(addLists){P.lists.types.forEach(t=>addType(t.name,t.debt));P.lists.categories.forEach(c=>addTo(S.lists.categories,c));P.lists.methods.forEach(c=>addTo(S.lists.methods,c))}
  debts.forEach(d=>addType(d.type,true));
  items.forEach(it=>{addType(it.type,false);addTo(S.lists.categories,it.category);addTo(S.lists.methods,it.method)});
  if(setYear&&P.year){S.year=P.year;cal={y:null,m:null,sel:null}}

/* ===================== SIMULATOR ===================== */
function deltaPill(v,goodWhenNegative=true,fmt=fm0){if(Math.abs(v)<0.5)return '<span class="delta zero">no change</span>';const good=goodWhenNegative?v<0:v>0;return `<span class="delta ${good?'good':'bad'}">${v>0?'+':'−'}${fmt(Math.abs(v))}</span>`}
function monthsBetween(a,b){return (b-a)/30.4375}
function vSimulator(M){
  const changes=(S.sim&&S.sim.changes)||[];const Y=M.Y;
  const sc=applyScenario(changes,Y);const N=summarize(sc.items,sc.debts,Y);
  const cmp=(label,a,b,goodNeg,fmt=fm0)=>`<div class="kpi"><span class="label">${label}</span><div class="cmp"><span class="b">${fmt(a)}</span><span class="arrow">→</span><span class="n">${fmt(b)}</span></div>${deltaPill(b-a,goodNeg,fmt)}</div>`;
  const rowsHtml=N.debts.map(nd=>{const bd=M.debts.find(x=>x.debt.id===nd.debt.id);const bal=+nd.debt.balance||0;
    const bPay=bd?bd.payoff:null,sPay=nd.payoff;let shift='';
    if(bPay&&bPay.date&&sPay.date){const mo=monthsBetween(sPay.date,bPay.date);shift=Math.abs(mo)<0.5?'<span class="delta zero">same</span>':`<span class="delta ${mo>0?'good':'bad'}">${mo>0?'':'+'}${Math.abs(mo).toFixed(1).replace(/\.0$/,'')} mo ${mo>0?'sooner':'later'}</span>`}
    const saved=bd?bd.interest-nd.interest:-nd.interest;
    return `<tr><td>${esc(nd.debt.name)}${nd.debt.sim?' <span class="pill" style="font-size:10px">what-if</span>':''}</td><td class="num">${fm0(bal)}</td><td class="num">${bd?fm0(bd.yearEnd):'–'}</td><td class="num"><b>${fm0(nd.yearEnd)}</b></td><td>${bPay?esc(bPay.label):'–'}</td><td><b>${esc(sPay.label)}</b> ${shift}</td><td class="num">${bd?deltaPill(-saved,true):'–'}</td></tr>`}).join('');
  const debtsAvail=S.debts.filter(d=>d.name&&+d.balance>0);
  return `<div class="view">
    <div class="card"><h2>What if…</h2><p class="small muted" style="margin:0 0 10px">Try changes without touching your real plan. Each change below is layered on top of what you actually have; remove them any time.</p>
      <div class="whatif">
        <button class="btn" type="button" data-act="simForm" data-kind="extra" ${debtsAvail.length?'':'disabled'}>Pay extra each month</button>
        <button class="btn" type="button" data-act="simForm" data-kind="lump" ${debtsAvail.length?'':'disabled'}>One-time lump sum</button>
        <button class="btn" type="button" data-act="simForm" data-kind="payoffDebt" ${debtsAvail.length?'':'disabled'}>Pay a debt off in full</button>
        <button class="btn" type="button" data-act="simForm" data-kind="newDebt">Take on new debt</button>
        <button class="btn" type="button" data-act="simForm" data-kind="newBill">Add a new bill</button>
        <button class="btn" type="button" data-act="simForm" data-kind="remove" ${S.items.length?'':'disabled'}>Cancel a bill</button>
        <button class="btn" type="button" data-act="simForm" data-kind="setAmount" ${S.items.length?'':'disabled'}>Change a payment amount</button>
      </div>
      ${changes.length?`<hr class="sep"><div class="changes">${changes.map(c=>{const [k,t]=describeChange(c);return `<div class="change"><span class="k">${esc(k)}</span><span>${esc(t)}</span><button type="button" data-act="simRemove" data-id="${c.id}" aria-label="Remove this change">×</button></div>`}).join('')}</div>
      <div class="row" style="margin-top:10px"><button class="btn small" type="button" data-act="simClear">Clear all changes</button></div>`:'<p class="small muted" style="margin:10px 0 0">No changes yet. Pick one above to see how it moves the numbers.</p>'}</div>
    <div class="grid kpis">
      ${cmp('Debt at year-end',M.balanceEnd,N.balanceEnd,true)}
      ${cmp('Interest paid this year',M.interest,N.interest,true)}
      ${cmp('Total paid out this year',M.total,N.total,true)}
      ${cmp('Debts cleared this year',M.cleared,N.cleared,false,v=>String(v))}
    </div>
    <div class="grid two">
      <div class="card"><h2>Projected debt balance</h2>${lineChart([{name:'What-if',values:N.balMonth,color:'var(--debt)'},{name:'Current plan',values:M.balMonth,color:'var(--ink-3)',dash:true}],MON,{aria:'Projected debt balance, current plan versus what-if'})}
        <div class="legend"><span><i style="background:var(--debt)"></i>What-if</span><span><i style="background:var(--ink-3)"></i>Current plan</span></div></div>
      <div class="card"><h2>Monthly payments</h2>${lineChart([{name:'What-if',values:N.monthTotal,color:'var(--nondebt)'},{name:'Current plan',values:M.monthTotal,color:'var(--ink-3)',dash:true}],MON,{zero:true,aria:'Monthly payments, current plan versus what-if'})}
        <div class="legend"><span><i style="background:var(--nondebt)"></i>What-if</span><span><i style="background:var(--ink-3)"></i>Current plan</span></div></div>
    </div>
    <div class="card"><h2>Debt by debt</h2><div class="table-wrap"><table class="sum"><thead><tr><th>Debt</th><th>Owed now</th><th>Year-end now</th><th>Year-end what-if</th><th style="text-align:left">Payoff now</th><th style="text-align:left">Payoff what-if</th><th>Interest saved</th></tr></thead><tbody>${rowsHtml||'<tr><td colspan="7" class="empty">No debts yet.</td></tr>'}</tbody></table></div>
      <p class="small muted" style="margin:10px 0 0">Interest saved counts this year only. Payoff dates beyond December are projected at the same pace of payments as this year.</p></div>
  </div>`;
}

    newBill:['Add a new bill',`<div class="field"><label>Name</label><input name="name" required placeholder="e.g. Gym membership"></div><div class="two"><div class="field"><label>Type</label><select name="type">${S.lists.types.map(t=>`<option>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Starting</label>${months(cur)}</div></div><div class="two"><div class="field"><label>Amount</label><input name="amount" type="number" inputmode="decimal" step="0.01" min="0.01" required></div><div class="field"><label>Frequency</label>${freqSel}</div></div>`],

  const [title,fields]=T[kind];

}

    <input type="hidden" name="id" value="${esc(d.id||'')}"></form>`);
  $('#debtForm').addEventListener('submit',e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target).entries());if(!v.name.trim())return;
    const rec={name:v.name.trim(),type:v.type,lender:v.lender,balance:+v.balance||0,apr:(+v.aprPct||0)/100,limit:+v.limit||0,minPayment:+v.minPayment||0,notes:v.notes};
    if(v.id){Object.assign(S.debts.find(x=>x.id===v.id),rec)}else{rec.id=uid();S.debts.push(rec)}
    S.sample=false;save();closeSheet();render();toast(v.id?'Saved':'Added')});
}

/* ===================== ACTIONS ===================== */
const actions={
  closeSheet:()=>closeSheet(),
  newItem:()=>itemForm({}), editItem:b=>itemForm(S.items.find(x=>x.id===b.dataset.id)||{}),
  newDebt:()=>debtForm({}), editDebt:b=>debtForm(S.debts.find(x=>x.id===b.dataset.id)||{}),
  newItemFor:b=>{const d=S.debts.find(x=>x.id===b.dataset.id);if(!d)return;const key=(d.type||'').toLowerCase().split(' ')[0];const cat=S.lists.categories.find(c=>key&&c.toLowerCase().startsWith(key))||'';itemForm({debtId:d.id,type:d.type,category:cat,name:d.name+' payment',amount:d.minPayment||''})},
  newIncome:()=>incomeForm({}), editIncome:b=>incomeForm((S.income||[]).find(x=>x.id===b.dataset.id)||{}),
  delIncome:b=>{if(b.dataset.armed){S.income=S.income.filter(x=>x.id!==b.dataset.id);save();closeSheet();render();toast('Deleted')}else{b.dataset.armed='1';b.textContent='Tap again to delete'}},
  delItem:b=>{if(b.dataset.armed){S.items=S.items.filter(x=>x.id!==b.dataset.id);save();closeSheet();render();toast('Deleted')}else{b.dataset.armed='1';b.textContent='Tap again to delete'}},
  delDebt:b=>{if(b.dataset.armed){S.debts=S.debts.filter(x=>x.id!==b.dataset.id);S.items.forEach(i=>{if(i.debtId===b.dataset.id)i.debtId=''});save();closeSheet();render();toast('Deleted')}else{b.dataset.armed='1';b.textContent='Tap again to delete'}},
  selDay:b=>{cal.sel=+b.dataset.dn;render()},
  calPrev:()=>{cal.m--;if(cal.m<1){cal.m=12}cal.sel=null;render()},
  calNext:()=>{cal.m++;if(cal.m>12){cal.m=1}cal.sel=null;render()},
  clearSample:()=>{S={year:S.year,sample:false,debts:[],items:[],income:[],lists:S.lists,weekStart:S.weekStart};save();render();toast('Samples cleared')},
  loadSample:()=>{S=sampleData();save();render();toast('Sample data loaded')},
  wipe:()=>{$('#wipeConfirm').hidden=false},
  wipeYes:()=>{S={year:S.year,sample:false,debts:[],items:[],income:[],lists:defaultLists()};save();render();toast('Everything deleted')},
  setYear:()=>{const y=+$('#yearInput').value;if(y>=2000&&y<=2100){S.year=y;cal={y:null,m:null,sel:null};save();render();toast('Year set to '+y)}},
  toggleDebt:b=>{const t=S.lists.types[+b.dataset.i];t.debt=!t.debt;save();render()},
  rmList:b=>{S.lists[b.dataset.key].splice(+b.dataset.i,1);save();render()},
  copyBackup:async()=>{const txt=JSON.stringify(S);const out=$('#backupOut');try{await navigator.clipboard.writeText(txt);toast('Backup copied')}catch(e){out.hidden=false;out.value=txt;out.focus();out.select();toast('Select all and copy')}},
  downloadBackup:()=>{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`payoff-planner-${S.year}.json`;document.body.appendChild(a);a.click();a.remove()},
  showPaste:()=>{$('#pasteBox').hidden=false;$('#pasteArea').focus()},
  impMerge:()=>applyImport('merge'),
  impReplace:b=>{if(b.dataset.armed)applyImport('replace');else{b.dataset.armed='1';b.textContent='Tap again to replace everything'}},
  simForm:b=>simForm(b.dataset.kind),
  simRemove:b=>{S.sim.changes=S.sim.changes.filter(c=>c.id!==b.dataset.id);save();render()},
  simClear:()=>{S.sim={changes:[]};save();render();toast('What-if cleared')},
  importPaste:()=>restore($('#pasteArea').value),
};
function restore(txt){try{const s=JSON.parse(txt);if(!s||!Array.isArray(s.items)||!Array.isArray(s.debts))throw 0;s.lists=s.lists||defaultLists();s.income=s.income||[];S=s;save();render();toast('Restored')}catch(e){toast('That is not a Payoff Planner backup')}}
document.addEventListener('change',e=>{if(e.target.id==='weekStart'){S.weekStart=+e.target.value;save();render();return}
  if((e.target.id==='xlsxFile'||e.target.id==='xlsxFile2')&&e.target.files[0]){const f=e.target.files[0];e.target.value='';importXlsx(f);return}
  if(e.target.id==='importFile'&&e.target.files[0]){const fr=new FileReader();fr.onload=()=>restore(fr.result);fr.readAsText(e.target.files[0])}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-act-form="addList"]');if(f){e.preventDefault();const inp=f.querySelector('input');const v=inp.value.trim();if(!v)return;const key=f.dataset.key;
  if(key==='types'){if(!S.lists.types.some(t=>t.name===v))S.lists.types.push({name:v,debt:false})}else if(!S.lists[key].includes(v))S.lists[key].push(v);save();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();actions[e.target.dataset.act]?.(e.target,e)}});

/* ===================== BOOT ===================== */
S=load();
const h=location.hash.slice(1);if(VIEWS[h])view=h;
render();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
